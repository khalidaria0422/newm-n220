<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig Latin Name</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <input
          type="text"
          name="First Name"
          placeholder="First Name"
          id="first-name"
        />
        <input
          type="text"
          name="Last Name"
          placeholder="Last Name"
          id="last-name"
        />
      </div>
      <button type="button" id="get-name">Get Name</button>

      <div class="output hidden">
        <p>Your pig latin name is <span id="result"></span></p>
        <button type="button" id="clear">Clear</button>
      </div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
