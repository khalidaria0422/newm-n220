<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Flip</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <table id="table">
      <tr>
        <th>Flips</th>
        <th>Result</th>
      </tr>
    </table>

    <div class="container">
      <div class="output hidden">
        <img src="#" alt="Image of a coin: heads or tails" id="image" />
      </div>
      <button type="button" id="toss">Toss</button>
      <button type="button" id="reset" class="hidden">Reset</button>
      <p id="ratio"></p>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
