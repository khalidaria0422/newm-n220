<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />

    <title>Circle Generator with Event Target</title>
  </head>
  <body>
    <div class="container">
      <div id="input">
        <input
          type="number"
          name="number"
          placeholder="Enter 1–100"
          id="number"
        />
        <button type="button" id="generate">Generate</button>
      </div>
      <button
        type="button"
        id="clear"
        style="position: absolute; top: 0; left: 0; margin-left: 1rem"
      >
        Clear
      </button>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
