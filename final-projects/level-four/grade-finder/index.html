<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Finder</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <p
      class="hidden"
      id="grade-average"
      style="position: absolute; top: 2rem; left: 20rem"
    ></p>
    <div class="container">
      <input
        type="text"
        name="point total"
        placeholder="Max possible points = 500"
        id="point-total"
      />
      <button type="button" id="get-grade">Get your grade</button>
      <button type="button" id="clear">Clear</button>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
