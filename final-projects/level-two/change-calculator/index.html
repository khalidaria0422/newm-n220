<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />

    <title>Change Calculator</title>
  </head>
  <body>
    <div class="container">
      <input
        type="number"
        name="change"
        placeholder="Enter change in pennies"
        id="change"
      />
      <button type="button" id="count-change">Count Change</button>

      <div class="output hidden">
        <div id="result"></div>
        <button type="button" id="clear">Clear</button>
      </div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
