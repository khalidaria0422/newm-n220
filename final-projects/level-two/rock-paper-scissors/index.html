<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock, Paper Scissors Game</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <table id="table">
      <tr>
        <th>Games</th>
        <th>Winner</th>
      </tr>
    </table>

    <div class="container">
      <div class="output hidden">
        <div class="player-1">
          <img src="#" alt="Image of a rock, paper, or scissors" id="image-0" />
        </div>
        <div class="player-2">
          <img src="#" alt="Image of a rock, paper, or scissors" id="image-1" />
        </div>
      </div>
      <button type="button" id="play-game">Play Game</button>

      <p id="winner"></p>
      <button type="button" id="reset" class="hidden">Reset</button>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
